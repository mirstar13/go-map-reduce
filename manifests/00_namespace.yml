apiVersion: v1
kind: Namespace
metadata:
  name: mapreduce
  labels:
    app: mapreduce
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: mapreduce
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# UI Service: Allow ingress from within the cluster (including Ingress Controller)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-ingress
  namespace: mapreduce
spec:
  podSelector:
    matchLabels:
      app: ui-service
  ingress:
    - ports:
        - protocol: TCP
          port: 8081
---
# Allow UI to talk to Manager, Keycloak, MinIO, and DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-egress
  namespace: mapreduce
spec:
  podSelector:
    matchLabels:
      app: ui-service
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: manager
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
    - to:
        - podSelector:
            matchLabels:
              app: minio
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Manager Service: Allow ingress from UI and Workers
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-manager-ingress
  namespace: mapreduce
spec:
  podSelector:
    matchLabels:
      app: manager
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ui-service
        - podSelector:
            matchLabels:
              app: mapreduce-worker
        - podSelector:
            matchLabels:
              app: mapreduce-builder
      ports:
        - protocol: TCP
          port: 8080
---
# Manager Service: Allow egress to Postgres, MinIO, K8s API, and DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-manager-egress
  namespace: mapreduce
spec:
  podSelector:
    matchLabels:
      app: manager
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app: mapreduce-builder
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32 # Internal Kubernetes API service
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Postgres: Allow ingress from Manager, Keycloak, db-migrate, and other Postgres pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: mapreduce
spec:
  podSelector:
    matchLabels:
      app: postgres
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: manager
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
        - podSelector:
            matchLabels:
              app: db-migrate
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# MinIO: Allow ingress from UI, Manager, and Workers
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio-ingress
  namespace: mapreduce
spec:
  podSelector:
    matchLabels:
      app: minio
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ui-service
        - podSelector:
            matchLabels:
              app: manager
        - podSelector:
            matchLabels:
              app: mapreduce-worker
        - podSelector:
            matchLabels:
              app: mapreduce-builder
      ports:
        - protocol: TCP
          port: 9000
---
# Keycloak: Allow ingress from Ingress Controller, UI, and Manager
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-ingress
  namespace: mapreduce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
              app.kubernetes.io/instance: ingress-nginx
        - podSelector:
            matchLabels:
              app: ui-service
        - podSelector:
            matchLabels:
              app: manager
      ports:
        - protocol: TCP
          port: 8080
---
# Keycloak: Allow egress to Postgres and DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-egress
  namespace: mapreduce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# db-migrate: Allow egress to Postgres and DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-migrate-egress
  namespace: mapreduce
spec:
  podSelector:
    matchLabels:
      app: db-migrate
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Workers: Allow egress to Manager, MinIO, and DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker-egress
  namespace: mapreduce
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [mapreduce-worker, mapreduce-builder]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: manager
    - to:
        - podSelector:
            matchLabels:
              app: minio
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Postgres: Allow egress to other Postgres pods (for replication) and DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-egress
  namespace: mapreduce
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
